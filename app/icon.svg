<!--
  Provisional favicon. Same class of placeholder as the header wordmark: the
  letter V, set in the serif brand face, on the brand-ink ground. TODO(OPN-09)
  — replace with the real mark when the client supplies one. Colours are
  written literally rather than as var(--color-*) because a favicon has no
  guaranteed CSS context; they mirror --color-brand-ink and --color-on-brand
  in styles/tokens.css and must be kept in sync with them by hand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0B1830" />
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="ui-serif, 'New York', Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="600"
    fill="#FFFFFF"
  >V</text>
</svg>
